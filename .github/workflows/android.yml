name: Build APK Corrected
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Usamos Java 17 por defecto, pero con tolerancias para Gradle moderno
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Corregir problemas de compatibilidad de permisos en Linux
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Descargar dependencias e intentar compilar ignorando advertencias menores
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # Guardar el APK si la compilación tuvo éxito
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MINE-SE-debug-apk
          path: app/build/outputs/apk/debug/*.apk
